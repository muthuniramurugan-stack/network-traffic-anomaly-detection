<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Traffic Anomaly Detection</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }
        header {
            background: #17243a;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #2563eb;
        }
        header h1 { color: #60a5fa; }
        main {
            max-width: 750px;
            margin: 65px auto;
            padding: 35px;
            background: #1e293b;
            border-radius: 14px;
            text-align: center;
        }
        .upload {
            border: 2px dashed #60a5fa;
            padding: 40px 15px;
            margin: 25px 0;
            border-radius: 12px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .error { color: #f87171; }
    </style>
</head>
<body>
<header>
    <h1>Network Traffic Anomaly Detection</h1>
    <p>Machine Learning Based Network Security Monitoring</p>
</header>

<main>
    <h2>Analyse Network Traffic</h2>
    <p>Upload a PCAP file to identify suspicious network behaviour.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <div class="upload">
            <h3>Select PCAP File</h3>
            <input type="file" name="pcap_file" accept=".pcap" required>
            <p>Maximum file size: 50 MB</p>
        </div>
        <button type="submit">Analyse Traffic</button>
    </form>
</main>
</body>
</html>
